<mat-card class="contact-table mat-elevation-z1">
  <mat-card-content>
    @if (error()) {
      <div class="contact-table__state contact-table__state--error">
        <div>
          <p class="contact-table__message contact-table__message--strong">
            {{ errorMessage() ?? 'Impossible de charger les contacts.' }}
          </p>
          <button mat-stroked-button color="warn" type="button" (click)="handleReload()">
            Réessayer
          </button>
        </div>
      </div>
    } @else if (loading()) {
      <div class="contact-table__state">
        <mat-progress-spinner diameter="32" mode="indeterminate"></mat-progress-spinner>
        <p class="contact-table__message">Chargement en cours…</p>
      </div>
    } @else if (contacts().length === 0) {
      <div class="contact-table__state contact-table__state--empty">
        <div>
          <p class="contact-table__message">Aucun contact pour le moment.</p>
          <button mat-raised-button color="primary" type="button" (click)="handleReload()">
            Actualiser
          </button>
        </div>
      </div>
    } @else {
      <div class="contact-table__wrapper">
        <table mat-table [dataSource]="contacts()" class="contact-table__mat-table">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef>Nom</th>
            <td mat-cell *matCellDef="let contact">
              {{ contact.name }}
            </td>
          </ng-container>

          <ng-container matColumnDef="email">
            <th mat-header-cell *matHeaderCellDef>Email</th>
            <td mat-cell *matCellDef="let contact">{{ contact.email }}</td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>
    }
  </mat-card-content>
</mat-card>
