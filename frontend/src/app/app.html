<mat-toolbar color="primary" class="app-toolbar">
  <span class="app-toolbar__title">CRM Auteur</span>

  <span class="app-toolbar__spacer"></span>

  <a
    mat-button
    routerLink="/contacts"
    routerLinkActive="is-active"
    [routerLinkActiveOptions]="{ exact: true }"
  >
    Contacts
  </a>
  <a mat-flat-button color="primary" routerLink="/contacts/new" routerLinkActive="is-active">
    Ajouter un contact
  </a>
</mat-toolbar>

<main class="layout">
  <section class="layout__content">
    <router-outlet />
  </section>
</main>
